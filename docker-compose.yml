services:

  # ── Ray head node (GCS on :6379, dashboard on :8265, client on :10001) ──
  ray-head:
    image: rayproject/ray:2.9.2-py311
    command: >
      ray start --head
      --dashboard-host 0.0.0.0
      --ray-client-server-port 10001
      --num-cpus 4
      --block
    ports:
      - "8265:8265"   # Ray dashboard
      - "10001:10001" # Ray client connections
    environment:
      - PYTHONPATH=/opt/dfp
    volumes:
      - ./app:/opt/dfp/app
      - ./storage:/storage
    networks:
      - ray-net
    healthcheck:
      test: ["CMD", "ray", "status"]
      interval: 15s
      timeout: 20s
      retries: 6
      start_period: 30s

  # ── Ray workers ──────────────────────────────────────────────────────────
  ray-worker:
    image: rayproject/ray:2.9.2-py311
    # Workers connect to head GCS port (6379 inside ray-head container).
    # ./app is mounted so remote task modules are importable on the workers.
    command: ray start --address='ray-head:6379' --num-cpus 2 --block
    depends_on:
      ray-head:
        condition: service_healthy
    environment:
      - PYTHONPATH=/opt/dfp
    volumes:
      - ./app:/opt/dfp/app
      - ./storage:/storage
    networks:
      - ray-net
    deploy:
      replicas: 2

  # ── Application Redis (job state + results) ──────────────────────────────
  redis:
    image: redis:7-alpine
    # Expose on host port 6380 to avoid collision with Ray GCS if also exposed
    ports:
      - "6380:6379"
    networks:
      - ray-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  # ── FastAPI application ───────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - RAY_ADDRESS=ray://ray-head:10001
      - STORAGE_TYPE=local
      - STORAGE_PATH=/storage
      - CHUNK_SIZE_ROWS=50000
      - MAX_CONCURRENT_TASKS=8
      - MAX_FILE_SIZE_MB=500
      - DEMO_MODE=true
      - ALLOWED_ORIGINS=*
      # Uncomment and set in production:
      # - API_KEY_SECRET=changeme
    depends_on:
      ray-head:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/storage
    networks:
      - ray-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  ray-net:
    driver: bridge
