name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8 — syntax errors and undefined names)
        run: |
          pip install flake8
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379
          RAY_ADDRESS: local
          STORAGE_PATH: /tmp/dfps-test-storage
          MAX_FILE_SIZE_MB: "10"
          ALLOWED_ORIGINS: "*"
        run: pytest tests/ -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t distributed-file-processor .

      - name: Smoke test with Docker Compose
        run: |
          docker compose up -d api redis
          sleep 20
          curl --fail --retry 5 --retry-delay 3 http://localhost:8000/health
          docker compose down
